<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-label="모비메이트 큰 그림: 손님, 매니저, 공식 창구, 게임"><title>모비메이트 큰 그림: 손님, 매니저, 공식 창구, 게임</title><rect width="800" height="310" rx="18" fill="#f3f7fb"/><text x="400" y="38" font-size="24" font-weight="800" fill="#1c2b3a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">모비메이트는 작은 식당이에요</text><rect x="30" y="70" width="150" height="150" rx="12" fill="#e3eefb" stroke="#2b7bd6" stroke-width="2"/><text x="105" y="100" font-size="18" font-weight="800" fill="#2b7bd6" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">손님 테이블</text><rect x="48" y="125" width="52" height="70" rx="8" fill="#2b7bd6" stroke="#2b7bd6" stroke-width="2"/><rect x="54" y="133" width="40" height="46" rx="4" fill="#e3eefb" stroke="#e3eefb" stroke-width="2"/><rect x="108" y="150" width="56" height="45" rx="6" fill="#7a5bd1" stroke="#7a5bd1" stroke-width="2"/><rect x="113" y="155" width="46" height="32" rx="3" fill="#ece6fb" stroke="#ece6fb" stroke-width="2"/><text x="105" y="240" font-size="14" font-weight="500" fill="#5c6f82" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">폰 · 노트북 · PC 브라우저</text><rect x="235" y="70" width="140" height="150" rx="12" fill="#ddf4e8" stroke="#1e9e6a" stroke-width="2"/><text x="305" y="100" font-size="18" font-weight="800" fill="#1e9e6a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">홀 매니저</text><circle cx="305" cy="148" r="26" fill="#f2b01e"/><circle cx="296" cy="144" r="3" fill="#1c2b3a"/><circle cx="314" cy="144" r="3" fill="#1c2b3a"/><path d="M295 157 Q305 166 315 157" stroke="#1c2b3a" stroke-width="3" fill="none"/><rect x="280" y="178" width="50" height="36" rx="12" fill="#1e9e6a" stroke="#1e9e6a" stroke-width="2"/><text x="305" y="240" font-size="14" font-weight="500" fill="#5c6f82" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">이 앱 (내 PC에서 실행)</text><rect x="430" y="70" width="140" height="150" rx="12" fill="#ece6fb" stroke="#7a5bd1" stroke-width="2"/><text x="500" y="100" font-size="18" font-weight="800" fill="#7a5bd1" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">공식 창구</text><rect x="455" y="125" width="90" height="60" rx="8" fill="#7a5bd1" stroke="#7a5bd1" stroke-width="2"/><rect x="463" y="135" width="74" height="28" rx="3" fill="#ece6fb" stroke="#ece6fb" stroke-width="2"/><rect x="458" y="168" width="84" height="8" rx="3" fill="#f2b01e" stroke="#f2b01e" stroke-width="2"/><text x="500" y="240" font-size="14" font-weight="500" fill="#5c6f82" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">넥슨 공식 CLI</text><rect x="625" y="70" width="145" height="150" rx="12" fill="#fde6ec" stroke="#e0577a" stroke-width="2"/><text x="697" y="100" font-size="18" font-weight="800" fill="#e0577a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">주방 = 게임</text><rect x="645" y="150" width="105" height="50" rx="10" fill="#e0577a" stroke="#e0577a" stroke-width="2"/><path d="M662 150 Q662 122 697 122 Q732 122 732 150Z" fill="#fff" stroke="#e0577a" stroke-width="3"/><path d="M690 122 Q684 106 694 98 Q694 112 704 114 Q712 118 706 122Z" fill="#e8743b"/><text x="697" y="240" font-size="14" font-weight="500" fill="#5c6f82" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">마비노기 모바일</text><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c6f82"/></marker></defs><path d="M184 145 L232 145" stroke="#5c6f82" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c6f82"/></marker></defs><path d="M379 145 L427 145" stroke="#5c6f82" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c6f82"/></marker></defs><path d="M574 145 L622 145" stroke="#5c6f82" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="400" y="285" font-size="16" font-weight="600" fill="#5c6f82" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">손님은 매니저에게만 말하고, 매니저는 공식 창구로만 주방과 이야기해요.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="숙제 자동 체크"><title>숙제 자동 체크</title><rect width="800" height="300" rx="18" fill="#f3f7fb"/><text x="400" y="36" font-size="24" font-weight="800" fill="#1c2b3a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">숙제가 저절로 체크돼요</text><rect x="30" y="60" width="740" height="190" rx="12" fill="#ffffff" stroke="#d6e0ea" stroke-width="2"/><text x="50" y="90" font-size="16" font-weight="800" fill="#1c2b3a" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">아이라_힐러 · 이번 주</text><rect x="50" y="106" width="84" height="30" rx="15" fill="#eef2f8" stroke="#eef2f8" stroke-width="0"/><text x="92.0" y="127" font-size="14" font-weight="600" fill="#9aa8b8" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">요일던전</text><path d="M60 121 L124 121" stroke="#9aa8b8" stroke-width="2"/><rect x="144" y="106" width="84" height="30" rx="15" fill="#eef2f8" stroke="#eef2f8" stroke-width="0"/><text x="186.0" y="127" font-size="14" font-weight="600" fill="#9aa8b8" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">길드의뢰</text><path d="M154 121 L218 121" stroke="#9aa8b8" stroke-width="2"/><rect x="238" y="106" width="70" height="30" rx="15" fill="#eef2f8" stroke="#eef2f8" stroke-width="0"/><text x="273.0" y="127" font-size="14" font-weight="600" fill="#9aa8b8" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">뱅가드</text><path d="M248 121 L298 121" stroke="#9aa8b8" stroke-width="2"/><rect x="318" y="106" width="168" height="30" rx="15" fill="#fff4d1" stroke="#f2b01e" stroke-width="2"/><text x="402.0" y="127" font-size="14" font-weight="700" fill="#1c2b3a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">소환의 결계 3/7<
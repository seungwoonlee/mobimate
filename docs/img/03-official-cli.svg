<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" role="img" aria-label="공식 CLI만 사용, 할 수 있는 일과 없는 일"><title>공식 CLI만 사용, 할 수 있는 일과 없는 일</title><rect width="800" height="310" rx="18" fill="#f3f7fb"/><text x="400" y="38" font-size="24" font-weight="800" fill="#1c2b3a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">게임 정보는 넥슨 공식 도구로만 읽어요</text><rect x="30" y="66" width="360" height="190" rx="12" fill="#ffffff" stroke="#1e9e6a" stroke-width="2"/><text x="50" y="96" font-size="19" font-weight="800" fill="#1e9e6a" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">하는 일</text><circle cx="58" cy="125" r="9" fill="#ddf4e8"/><path d="M53 125 l4 4 l8 -9" stroke="#1e9e6a" stroke-width="3" fill="none" stroke-linecap="round"/><text x="78" y="131" font-size="15" font-weight="600" fill="#1c2b3a" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">게임이 공개한 AI 커넥터(CLI)에 물어보기</text><circle cx="58" cy="155" r="9" fill="#ddf4e8"/><path d="M53 155 l4 4 l8 -9" stroke="#1e9e6a" stroke-width="3" fill="none" stroke-linecap="round"/><text x="78" y="161" font-size="15" font-weight="600" fill="#1c2b3a" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">키보드·마우스를 대신 누르지 않기</text><circle cx="58" cy="185" r="9" fill="#ddf4e8"/><path d="M53 185 l4 4 l8 -9" stroke="#1e9e6a" stroke-width="3" fill="none" stroke-linecap="round"/><text x="78" y="191" font-size="15" font-weight="600" fill="#1c2b3a" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">게임 파일·메모리를 건드리지 않기</text><circle cx="58" cy="215" r="9" fill="#ddf4e8"/><path d="M53 215 l4 4 l8 -9" stroke="#1e9e6a" stroke-width="3" fill="none" stroke-linecap="round"/><text x="78" y="221" font-size="15" font-weight="600" fill="#1c2b3a" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">채팅은 내가 누를 때만 보내기</text><rect x="410" y="66" width="360" height="190" rx="12" fill="#ffffff" stroke="#e8743b" stroke-width="2"/><text x="430" y="96" font-size="19" font-weight="800" fill="#e8743b" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">그래서 못 하는 일 (솔직히)</text><circle cx="438" cy="125" r="9" fill="#fdeadc"/><path d="M434 121 l8 8 m0 -8 l-8 8" stroke="#e8743b" stroke-width="3" stroke-linecap="round"/><text x="458" y="131" font-size="15" font-weight="600" fill="#1c2b3a" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">캐릭터 이름은 직접 정해 줘요 (CLI가 안 알려줘요)</text><circle cx="438" cy="155" r="9" fill="#fdeadc"/><path d="M434 151 l8 8 m0 -8 l-8 8" stroke="#e8743b" stroke-width="3" stroke-linecap="round"/><text x="458" y="161" font-size="15" font-weight="600" fill="#1c2b3a" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">서버 랭킹은 없어요 (공식 도구에 없음)</text><circle cx="438" cy="185" r="9" fill="#fdeadc"/><path d="M434 181 l8 8 m0 -8 l-8 8" stroke="#e8743b" stroke-width="3" stroke-linecap="round"/><text x="458" y="191" font-size="15" font-weight="600" fill="#1c2b3a" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">어느 레이드를 깼는지까지는 몰라요</text><circle cx="438" cy="215" r="9" fill="#fdeadc"/><path d="M434 211 l8 8 m0 -8 l-8 8" stroke="#e8743b" stroke-width="3" stroke-linecap="round"/><text x="458" y="221" font-size="15" font-weight="600" fill="#1c2b3a" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">게임이 꺼져 있으면 지난 값만 보여요</text><text x="400" y="290" font-size="15" font-weight="600" fill="#5c6f82" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">넥슨이 공개한 AI 커넥터 범위 안에서만 움직이는 비공식 팬 프로젝트예요.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" role="img" aria-label="무설치 단일 파일 실행"><title>무설치 단일 파일 실행</title><rect width="800" height="290" rx="18" fill="#f3f7fb"/><text x="400" y="38" font-size="24" font-weight="800" fill="#1c2b3a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">설치가 없어요. 파일 하나면 끝!</text><rect x="40" y="70" width="170" height="150" rx="12" fill="#ffffff" stroke="#2b7bd6" stroke-width="2"/><rect x="75" y="92" width="100" height="78" rx="8" fill="#e3eefb" stroke="#2b7bd6" stroke-width="2"/><text x="125" y="143" font-size="15" font-weight="800" fill="#2b7bd6" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">MobiMateWeb</text><text x="125" y="160" font-size="14" font-weight="700" fill="#2b7bd6" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">.exe</text><text x="125" y="202" font-size="17" font-weight="800" fill="#1c2b3a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">1  내려받기</text><rect x="315" y="70" width="170" height="150" rx="12" fill="#ffffff" stroke="#1e9e6a" stroke-width="2"/><circle cx="400" cy="130" r="30" fill="#ddf4e8" stroke="#1e9e6a" stroke-width="3"/><path d="M386 130 L396 141 L416 117" stroke="#1e9e6a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="202" font-size="17" font-weight="800" fill="#1c2b3a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">2  더블클릭</text><rect x="590" y="70" width="170" height="150" rx="12" fill="#ffffff" stroke="#7a5bd1" stroke-width="2"/><rect x="612" y="92" width="126" height="84" rx="8" fill="#ece6fb" stroke="#7a5bd1" stroke-width="2"/><rect x="612" y="92" width="126" height="16" rx="8" fill="#7a5bd1" stroke="#7a5bd1" stroke-width="2"/><text x="675" y="146" font-size="15" font-weight="800" fill="#7a5bd1" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">내 캐릭터</text><text x="675" y="202" font-size="17" font-weight="800" fill="#1c2b3a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">3  브라우저에서 보기</text><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c6f82"/></marker></defs><path d="M214 145 L311 145" stroke="#5c6f82" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c6f82"/></marker></defs><path d="M489 145 L586 145" stroke="#5c6f82" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="400" y="262" font-size="15" font-weight="600" fill="#5c6f82" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">설치 프로그램도, 따로 깔 것도, 레지스트리도 없어요. 지우고 싶으면 파일만 지우면 돼요.</text></svg>
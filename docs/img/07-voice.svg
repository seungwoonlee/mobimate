<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" role="img" aria-label="음성 입력"><title>음성 입력</title><rect width="800" height="290" rx="18" fill="#f3f7fb"/><text x="400" y="36" font-size="24" font-weight="800" fill="#1c2b3a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">말하면 글자가 돼요 (PC에서만)</text><rect x="30" y="66" width="230" height="170" rx="12" fill="#ffffff" stroke="#d6e0ea" stroke-width="2"/><rect x="125" y="96" width="40" height="64" rx="20" fill="#f2b01e"/><path d="M105 140 Q105 180 145 180 Q185 180 185 140 M145 180 V204" stroke="#1c2b3a" stroke-width="4" fill="none" stroke-linecap="round"/><text x="145" y="226" font-size="15" font-weight="800" fill="#1c2b3a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">마이크에 말하기</text><rect x="285" y="66" width="230" height="170" rx="12" fill="#ffffff" stroke="#d6e0ea" stroke-width="2"/><text x="400" y="100" font-size="17" font-weight="800" fill="#7a5bd1" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">두 가지 귀</text><rect x="305" y="114" width="190" height="50" rx="10" fill="#e3eefb" stroke="#2b7bd6" stroke-width="2"/><text x="400" y="135" font-size="15" font-weight="800" fill="#2b7bd6" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">바로 듣는 귀</text><text x="400" y="154" font-size="12" font-weight="600" fill="#5c6f82" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">말하는 중에 글자가 떠요</text><rect x="305" y="172" width="190" height="50" rx="10" fill="#ece6fb" stroke="#7a5bd1" stroke-width="2"/><text x="400" y="193" font-size="15" font-weight="800" fill="#7a5bd1" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">끝까지 듣는 귀 (Qwen3)</text><text x="400" y="212" font-size="12" font-weight="600" fill="#5c6f82" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">시끄러운 곳에 더 강해요</text><rect x="540" y="66" width="230" height="170" rx="12" fill="#ffffff" stroke="#d6e0ea" stroke-width="2"/><rect x="560" y="96" width="190" height="36" rx="18" fill="#eef2f8" stroke="#eef2f8" stroke-width="2"/><text x="655" y="120" font-size="14" font-weight="700" fill="#1c2b3a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">레이드 같이 가실 분~</text><rect x="560" y="146" width="190" height="28" rx="14" fill="#ddf4e8" stroke="#ddf4e8" stroke-width="2"/><text x="655" y="165" font-size="13" font-weight="700" fill="#1e9e6a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">게임 채팅으로 전송</text><text x="655" y="214" font-size="14" font-weight="800" fill="#1c2b3a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">고쳐서 가르치면 기억해요</text><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c6f82"/></marker></defs><path d="M264 150 L281 150" stroke="#5c6f82" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c6f82"/></marker></defs><path d="M519 150 L536 150" stroke="#5c6f82" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="400" y="270" font-size="15" font-weight="600" fill="#5c6f82" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">소리는 이 PC 안에서만 처리하고 어디로도 보내지 않아요.</text></svg>
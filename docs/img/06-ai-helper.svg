<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" width="800" height="312" role="img" aria-label="AI 도우미: 수거 명령"><title>AI 도우미: 수거 명령</title><rect width="800" height="312" rx="18" fill="#f3f7fb"/><text x="400" y="36" font-size="24" font-weight="800" fill="#1c2b3a" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">말로 시키면 해 줘요 (AI 도우미)</text><rect x="30" y="60" width="740" height="205" rx="12" fill="#ffffff" stroke="#d6e0ea" stroke-width="2"/><rect x="60" y="80" width="300" height="40" rx="20" fill="#e3eefb" stroke="#e3eefb" stroke-width="2"/><text x="80" y="106" font-size="16" font-weight="700" fill="#2b7bd6" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">완성된 가공물 수거해줘</text><rect x="300" y="135" width="440" height="40" rx="20" fill="#ddf4e8" stroke="#ddf4e8" stroke-width="2"/><text x="320" y="161" font-size="16" font-weight="700" fill="#1e9e6a" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">옷감·가죽·약품 시설 3곳에서 수거했어요</text><rect x="60" y="190" width="330" height="40" rx="20" fill="#fff4d1" stroke="#fff4d1" stroke-width="2"/><text x="80" y="216" font-size="16" font-weight="700" fill="#e8743b" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">가방이 가득 차서 못 거뒀어요</text><text x="410" y="216" font-size="14" font-weight="600" fill="#5c6f82" text-anchor="start" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">← 게임이 거절하면 이유를 그대로 알려 줘요</text><text x="400" y="292" font-size="15" font-weight="600" fill="#5c6f82" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">채집 · 수거 · 행동 정지. 게임이 안 한 일을 했다고 말하지 않아요.</text></svg>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>MobiMate 웹 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg-0:#E9EEF2; --bg-1:#F4F7F9; --bg-2:#FFFFFF; --bg-3:#E6ECF1; --bg-inset:#EEF2F6;
  --line:#D5DDE5; --line-strong:#BAC6D2;
  --text-1:#14202B; --text-2:#4A5A6A; --text-3:#5E6A77;
  --accent:#0B6F68; --accent-2:#08564F; --accent-soft:#D3EFEA; --on-accent:#FFFFFF;
  --gold:#946511; --gold-soft:#F5E8CB;
  --cyan:#1B78A0; --cyan-soft:#D8ECF5;
  --ok:#17744A; --ok-soft:#DBF2E6; --warn:#8F5200; --warn-soft:#FAEACF; --danger:#B8312A; --danger-soft:#FADCD9; --on-danger:#FFFFFF; --qr-bg:#FFFFFF; --qr-fg:#0B0F13;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 8px 24px rgba(20,32,43,.08);
  --page:#DDE4EA; --bezel:#1A2028; --bezel-edge:#2C3540; --scrim:rgba(10,16,22,.45);
  --f-body:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Barlow Semi Condensed","IBM Plex Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-0:#0B0F13; --bg-1:#11171E; --bg-2:#172029; --bg-3:#202A35; --bg-inset:#0F151B;
    --line:#25303C; --line-strong:#33414F;
    --text-1:#E7EDF2; --text-2:#A0AEBB; --text-3:#8896A5;
    --accent:#4FC4BA; --accent-2:#7AD6CE; --accent-soft:rgba(79,196,186,.14); --on-accent:#06201D;
    --gold:#E9B65A; --gold-soft:rgba(233,182,90,.13);
    --cyan:#62B9E0; --cyan-soft:rgba(98,185,224,.13);
    --ok:#4BC78C; --ok-soft:rgba(75,199,140,.14); --warn:#EFA43F; --warn-soft:rgba(239,164,63,.15); --danger:#EF615B; --danger-soft:rgba(239,97,91,.15); --on-danger:#1C0706;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    --page:#06090C; --bezel:#05070A; --bezel-edge:#222B35; --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-0:#0B0F13; --bg-1:#11171E; --bg-2:#172029; --bg-3:#202A35; --bg-inset:#0F151B;
  --line:#25303C; --line-strong:#33414F;
  --text-1:#E7EDF2; --text-2:#A0AEBB; --text-3:#8896A5;
  --accent:#4FC4BA; --accent-2:#7AD6CE; --accent-soft:rgba(79,196,186,.14); --on-accent:#06201D;
  --gold:#E9B65A; --gold-soft:rgba(233,182,90,.13);
  --cyan:#62B9E0; --cyan-soft:rgba(98,185,224,.13);
  --ok:#4BC78C; --ok-soft:rgba(75,199,140,.14); --warn:#EFA43F; --warn-soft:rgba(239,164,63,.15); --danger:#EF615B; --danger-soft:rgba(239,97,91,.15); --on-danger:#1C0706;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --page:#06090C; --bezel:#05070A; --bezel-edge:#222B35; --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text-1);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ───────── 시안 바깥 틀 ───────── */
.mk{padding-inline:max(16px,3vw);padding-block:20px 40px;max-width:1680px;margin-inline:auto}
.mk-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:14px}
.mk-head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.mk-head p{margin:2px 0 0;color:var(--text-2);font-size:13px}
.mk-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button small{display:block;font-size:11px;font-weight:400;color:var(--text-3)}
.mk-toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.mk-toggle input{width:16px;height:16px;accent-color:var(--accent)}
.stage{display:flex;justify-content:center;align-items:flex-start;min-height:200px}
.frame-box{position:relative;flex:none}
.device{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bezel);border:1px solid var(--bezel-edge);border-radius:22px;padding:12px;box-shadow:var(--shadow)}
.device.is-handheld{border-radius:40px;padding:14px}
.screen{position:relative;overflow:hidden;border-radius:12px;background:var(--bg-0)}
.device.is-handheld .screen{border-radius:28px}
.crease{position:absolute;pointer-events:none;z-index:50}
.crease.v{top:0;bottom:0;left:50%;width:1px;background:linear-gradient(transparent,rgba(127,140,155,.25) 20%,rgba(127,140,155,.25) 80%,transparent)}
.mk-notes{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.note{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.note h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--text-1)}
.note p,.note li{margin:0;color:var(--text-2);font-size:13px}
.note ul{margin:0;padding-left:18px;display:grid;gap:3px}
.live-strip{display:none}
body.live .mk{display:none}
body.live .live-strip{display:flex;position:fixed;left:0;right:0;top:0;height:30px;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;padding-top:env(safe-area-inset-top,0px);background:var(--bg-1);border-bottom:1px solid var(--line);font-size:12px;color:var(--text-2);z-index:100}
.live-strip button{border:1px solid var(--line);background:var(--bg-2);border-radius:999px;padding:2px 10px;font-size:12px}
.live-host{display:none}
body.live .live-host{display:block;position:fixed;left:0;right:0;bottom:0;top:calc(30px + env(safe-area-inset-top,0px))}

/* ───────── 앱 셸 ───────── */
.app{--scale:1;position:relative;height:100%;width:100%;display:grid;background:var(--bg-0);color:var(--text-1);font-size:calc(15px * var(--scale));overflow:hidden;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "tabs"}
.app[data-size="medium"]{grid-template-columns:72px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "rail main"}
.app[data-size="expanded"],.app[data-size="large"]{grid-template-columns:72px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "rail main"}
.app[data-dock-mode="side"][data-dock-open="true"][data-size="expanded"]{grid-template-columns:72px minmax(0,1fr) 320px;grid-template-areas:"top top top" "rail main dock"}
.app[data-dock-mode="side"][data-dock-open="true"][data-size="large"]{grid-template-columns:76px minmax(0,1fr) 360px;grid-template-areas:"top top top" "rail main dock"}
.app[data-posture="book"]{grid-template-columns:72px minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top top" "rail main dock"}
.app[data-posture="tabletop"]{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 16px minmax(0,1fr);grid-template-areas:"top" "main" "hinge" "dock"}

/* 상단 바 */
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--bg-1);border-bottom:1px solid var(--line);min-width:0}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);flex:none}
.app[data-offline="true"] .dot{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.who-txt{min-width:0}
.who-name{font-weight:600;font-size:calc(15px * var(--scale));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-name .job{color:var(--text-2);font-weight:500}
.who-title{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--bg-3);color:var(--text-2);font-size:12px;font-weight:500;vertical-align:1px}
.who-where{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-where .ic{width:14px;height:14px}
.top-kpi{display:flex;align-items:baseline;gap:8px;padding:4px 12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);flex:none}
.top-kpi .lbl{font-size:12px;color:var(--text-2)}
.top-kpi .v{font-size:22px;font-weight:600}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);color:var(--text-2)}
.icon-btn:hover{color:var(--text-1);border-color:var(--line-strong)}
.refresh{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);color:var(--text-2);font-size:12.5px}
.refresh .ic{width:16px;height:16px}
.refresh.flash{color:var(--accent);border-color:var(--accent)}
.stop-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:var(--danger);color:var(--on-danger);font-weight:600;font-size:13.5px}
.stop-btn .ic{width:18px;height:18px}
.stop-btn:hover{filter:brightness(1.07)}
.stop-btn kbd{font:inherit;font-size:11px;opacity:.8;border:1px solid currentColor;border-radius:5px;padding:0 5px}
.offline-banner{display:none}
.app[data-offline="true"] .offline-banner{display:flex;position:absolute;left:50%;transform:translateX(-50%);top:62px;z-index:40;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--danger-soft);color:var(--danger);font-size:13px;font-weight:600;border:1px solid var(--danger);white-space:nowrap}
.app[data-offline="true"] [data-needs-conn]{opacity:.45;pointer-events:none}
.app[data-offline="true"] .main-inner{filter:saturate(.4);opacity:.72}

.app[data-size="compact"] .top{padding:8px 12px;gap:8px}
.app[data-size="compact"] .top-kpi,.app[data-size="compact"] .top .stop-btn,.app[data-size="compact"] .refresh-txt{display:none}
.app[data-size="compact"] .who-title{display:none}
.app[data-size="compact"] .refresh{width:38px;padding:0;justify-content:center}
.app[data-size="medium"] .who-title,.app[data-size="medium"] .top-kpi{display:none}
.app[data-short="true"] .who-where{display:none}
.app[data-short="true"] .top{padding-block:6px}
.more-btn{display:none}
.app[data-size="compact"] .more-btn{display:inline-grid}

/* 내비 레일 */
.rail{grid-area:rail;display:none;flex-direction:column;align-items:center;gap:4px;padding:10px 0;background:var(--bg-1);border-right:1px solid var(--line);overflow-y:auto}
.app:not([data-size="compact"]):not([data-posture="tabletop"]) .rail,.app[data-posture="book"] .rail{display:flex}
.rail button{width:60px;border:0;background:transparent;border-radius:12px;padding:7px 0 5px;display:grid;justify-items:center;gap:3px;color:var(--text-2);font-size:11px;font-weight:500}
.rail button .ic{width:22px;height:22px}
.rail button:hover{background:var(--bg-3);color:var(--text-1)}
.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.rail .sp{flex:1}
.rail .chat-toggle{display:none}
.app[data-dock-mode="sheet"] .rail .chat-toggle,.app[data-dock-mode="side"][data-dock-open="false"] .rail .chat-toggle{display:grid}

/* 하단 탭 */
.tabs{grid-area:tabs;display:none;background:var(--bg-1);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.app[data-size="compact"]:not([data-posture="tabletop"]) .tabs{display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--text-2);font-size:11.5px;font-weight:500;min-height:52px}
.tabs button .ic{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"] .ic{background:var(--accent-soft);border-radius:999px;padding:2px 12px;width:48px;box-sizing:border-box}
.fab-stop{display:none}
.app[data-size="compact"]:not([data-posture="tabletop"]) .fab-stop{display:grid;place-items:center;position:absolute;right:14px;bottom:78px;width:56px;height:56px;border-radius:18px;border:0;background:var(--danger);color:var(--on-danger);box-shadow:0 6px 18px rgba(194,54,47,.35);z-index:30}
.fab-stop .ic{width:24px;height:24px}

/* 본문 */
.main{grid-area:main;overflow-y:auto;overscroll-behavior-y:contain;container-type:inline-size;container-name:main;min-width:0}
.main-inner{padding:18px 20px 28px;display:grid;gap:16px;max-width:1280px}
.app[data-size="compact"] .main-inner{padding:12px 12px 90px;gap:12px}
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.view-head h2{margin:0;font-size:calc(19px * var(--scale));font-weight:700;letter-spacing:-.01em}
.view-head .sub{color:var(--text-2);font-size:13px}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-h h3{margin:0;font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.card-h h3 .ic{width:16px;height:16px}
.card.link{cursor:pointer;transition:border-color .15s,transform .15s}
.card.link:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.big{font-size:calc(34px * var(--scale));font-weight:600;line-height:1.05}
.mid{font-size:calc(24px * var(--scale));font-weight:600;line-height:1.1}
.delta{display:inline-flex;align-items:center;gap:2px;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:600;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.delta.up{background:var(--ok-soft);color:var(--ok)}
.delta.down{background:var(--danger-soft);color:var(--danger)}
.delta.good-down{background:var(--ok-soft);color:var(--ok)}
.delta.bad-up{background:var(--warn-soft);color:var(--warn)}
.muted{color:var(--text-2)}
.faint{color:var(--text-3)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0}
.kv .v{font-weight:600}

.alerts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:var(--bg-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--text-1);min-height:34px}
.chip .ic{width:16px;height:16px}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.info{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.g-hero{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.g-prog{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@container main (min-width:560px){
  .g-hero{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-hero .gold{grid-column:span 2}
  .g-hero .gold .gold-body{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:end}
}
@container main (min-width:900px){
  .g-hero{grid-template-columns:1fr 1fr 1.25fr}
  .g-hero .gold{grid-column:auto}
  .g-hero .gold .gold-body{display:block}
  .g-prog{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.gauge{height:12px;border-radius:999px;background:var(--bg-3);overflow:hidden;margin:10px 0 8px}
.gauge>i{display:block;height:100%;border-radius:inherit;background:var(--ok)}
.gauge.warn>i{background:var(--warn)}
.gauge.danger>i{background:var(--danger)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.state .ic{width:15px;height:15px}
.state.ok{color:var(--ok)} .state.warn{color:var(--warn)} .state.danger{color:var(--danger)}
.ring-row{display:flex;align-items:center;gap:12px}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--bg-3)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{fill:var(--text-1);font-family:var(--f-num);font-weight:600;font-size:17px}
.work{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.work .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--accent-soft);color:var(--accent)} .pill.gold{background:var(--gold-soft);color:var(--gold)} .pill.cyan{background:var(--cyan-soft);color:var(--cyan)} .pill.danger{background:var(--danger-soft);color:var(--danger)} .pill.plain{background:var(--bg-3);color:var(--text-2)}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@container main (min-width:700px){.qa{grid-template-columns:repeat(4,minmax(0,1fr))}}
.qa button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg-2);border-radius:14px;padding:12px 14px;min-height:56px}
.qa button:hover{border-color:var(--line-strong)}
.qa button .ic{width:22px;height:22px;color:var(--accent)}
.qa button b{display:block;font-size:14px;font-weight:600}
.qa button span{display:block;font-size:12px;color:var(--text-2)}
.qa button.danger .ic{color:var(--danger)}

/* 글랜스(커버 화면)·테이블톱 */
.glance{display:grid;gap:10px;grid-template-columns:1fr}
.app[data-posture="tabletop"] .glance{grid-template-columns:repeat(4,minmax(0,1fr))}
.glance .card{padding:12px 14px}
.glance .big{font-size:calc(30px * var(--scale))}
.glance-stop,.app[data-touch="true"] .glance-stop{width:100%;justify-content:center;height:52px;font-size:15px;border-radius:14px}
.hinge{grid-area:hinge;display:none}
.app[data-posture="tabletop"] .hinge{display:block;background:linear-gradient(var(--bg-0),var(--bezel) 45%,var(--bezel) 55%,var(--bg-0))}

/* 목록·표 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg-2)}
.search .ic{width:16px;height:16px;color:var(--text-3)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:14px}
.list{display:grid;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.row .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t .ic{width:14px;height:14px;color:var(--text-3)}
.row .m{grid-column:1;font-size:12.5px;color:var(--text-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .r{grid-column:2;grid-row:1 / span 2;text-align:right;display:grid;justify-items:end;gap:4px}
.bar{height:6px;border-radius:999px;background:var(--bg-3);overflow:hidden;width:100%;max-width:220px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:16px;height:16px}
.two{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@container main (min-width:760px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.tile .l{font-size:12px;color:var(--text-2)}
.tile .v{font-size:22px;font-weight:600}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg-2);overflow:hidden}
.stepper button{border:0;background:transparent;height:34px;min-width:36px;font-size:13px;font-weight:600;color:var(--text-2)}
.stepper button:hover{background:var(--bg-3)}
.stepper .v{min-width:56px;text-align:center;font-size:17px;font-weight:600;border-inline:1px solid var(--line);line-height:34px}

/* 도크 */
.dock{grid-area:dock;display:flex;flex-direction:column;min-height:0;background:var(--bg-1);border-left:1px solid var(--line)}
.app[data-dock-mode="side"][data-dock-open="false"] .dock{display:none}
.app[data-dock-mode="sheet"] .dock{position:absolute;z-index:60;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .22s ease,opacity .22s ease}
.app[data-dock-mode="sheet"][data-size="compact"] .dock{left:0;right:0;bottom:0;top:44px;border-radius:20px 20px 0 0}
.app[data-dock-mode="sheet"]:not([data-size="compact"]) .dock{top:0;right:0;bottom:0;width:min(420px,90%);border-radius:18px 0 0 18px}
.app[data-dock-mode="sheet"][data-dock-open="false"] .dock{transform:translateY(105%);opacity:0;pointer-events:none}
.app[data-dock-mode="sheet"]:not([data-size="compact"])[data-dock-open="false"] .dock{transform:translateX(105%)}
.app[data-posture="tabletop"] .dock,.app[data-posture="book"] .dock{border-left:0}
.app[data-posture="book"] .dock{border-left:1px solid var(--line)}
.scrim{display:none}
.app[data-dock-mode="sheet"][data-dock-open="true"] .scrim{display:block;position:absolute;inset:0;background:var(--scrim);z-index:55}
.dock-stop{display:none}
.app[data-dock-mode="split"] .dock-h [data-act="dock-close"]{display:none}
.app[data-dock-mode="sheet"] .dock-stop{display:inline-flex;height:38px;padding:0 12px}
.app[data-touch="true"] .icon-btn,.app[data-touch="true"] .refresh,.app[data-touch="true"] .stop-btn{height:44px}
.app[data-touch="true"] .icon-btn{width:44px}
.app[data-touch="true"] .chip,.app[data-touch="true"] .btn,.app[data-touch="true"] .stepper button,.app[data-touch="true"] .seg button{min-height:44px}
.app[data-touch="true"] .stepper .v{line-height:44px}
.grab{display:none}
.app[data-dock-mode="sheet"][data-size="compact"] .grab{display:block;width:40px;height:4px;border-radius:999px;background:var(--line-strong);margin:8px auto 0}
.dock-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dock-h .seg{flex:1;display:flex}
.dock-h .seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.dock-h .seg .ic{width:16px;height:16px}
.app[data-posture="tabletop"] .dock-h .seg button[data-tab="ai"]{display:none}
.panel{display:none;flex-direction:column;min-height:0;flex:1}
.app[data-dock-tab="game"] .panel.game,.app[data-dock-tab="ai"] .panel.ai{display:flex}
.persona{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.select{position:relative;flex:1;min-width:0}
.select select{width:100%;appearance:none;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg-2);padding:0 34px 0 12px;font-size:13.5px;font-weight:500}
.select .ic{position:absolute;right:10px;top:10px;width:18px;height:18px;pointer-events:none;color:var(--text-3)}
.hint{margin:0 12px 0;padding:6px 10px;border-radius:10px;background:var(--bg-3);color:var(--text-2);font-size:12px}
.log{flex:1;overflow-y:auto;overscroll-behavior-y:contain;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.msg{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13.5px}
.msg .meta{display:flex;gap:6px;align-items:center;color:var(--text-3);font-size:11.5px;margin-bottom:2px;flex-wrap:wrap}
.msg .meta .ok{color:var(--ok);font-weight:600}
.msg .meta .fail{color:var(--danger);font-weight:600}
.msg.fail{border-color:var(--danger-soft)}
.msg .retry{margin-top:6px}
.composer{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;background:var(--bg-1)}
.comp-row{display:flex;gap:8px;align-items:center}
.comp-row input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);padding:0 12px;font-size:15px;outline:0}
.comp-row input:focus{border-color:var(--accent)}
.send{width:44px;height:44px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.comp-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-3);min-height:18px}
.comp-meta .cnt.warn{color:var(--warn);font-weight:600}
.comp-meta .pv{color:var(--accent);font-weight:600}
.tt-quick{display:none}
.app[data-posture="tabletop"] .tt-quick{display:flex;gap:8px;padding:0 12px 10px;background:var(--bg-1);overflow-x:auto}
.app[data-posture="tabletop"] .tt-quick .btn{flex:1}
.app[data-posture="tabletop"] .panel.game .log{display:none}
.app[data-posture="tabletop"] .persona{border-bottom:0}

.engine{position:relative;padding:10px 12px;border-bottom:1px solid var(--line)}
.engine-btn{width:100%;display:flex;align-items:center;gap:8px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg-2);padding:0 10px;text-align:left}
.engine-btn .nm{flex:1;min-width:0;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.engine-menu{position:absolute;left:12px;right:12px;top:54px;z-index:20;background:var(--bg-2);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:grid;gap:2px}
.engine-menu button{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:8px;padding:8px;text-align:left;font-size:13.5px}
.engine-menu button:hover{background:var(--bg-3)}
.engine-menu button .nm{flex:1}
.shelf{display:grid;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.shelf.big{grid-template-columns:repeat(2,minmax(0,1fr))}
.shelf.big button{text-align:left;border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:9px 10px;font-size:12.5px;line-height:1.35;color:var(--text-1)}
.shelf.big button:hover{border-color:var(--accent)}
.shelf.small{display:flex;overflow-x:auto;scrollbar-width:none}
.shelf.small button{border:1px solid var(--line);background:var(--bg-2);border-radius:999px;padding:5px 10px;font-size:12px;white-space:nowrap}
.bubble{max-width:88%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--accent-soft);color:var(--text-1);border-bottom-right-radius:4px}
.bubble.ai{align-self:flex-start;background:var(--bg-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble .who{display:block;font-size:11px;color:var(--text-3);margin-bottom:2px}
.intent{align-self:stretch;border:1px solid var(--accent);background:var(--bg-2);border-radius:14px;padding:12px;display:grid;gap:8px}
.intent h4{margin:0;font-size:14px;display:flex;align-items:center;gap:6px}
.intent h4 .ic{width:18px;height:18px;color:var(--accent)}
.intent p{margin:0;font-size:13px;color:var(--text-2)}
.intent .acts{display:flex;gap:8px}
.intent.done{border-color:var(--line)}
.cursor::after{content:"▍";color:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* 토스트·다이얼로그 */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;z-index:90;display:grid;gap:8px;justify-items:center;pointer-events:none;width:min(440px,92%)}
.app[data-size="compact"] .toasts{bottom:82px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--text-1);color:var(--bg-2);font-size:13.5px;font-weight:500;box-shadow:var(--shadow);animation:tin .2s ease}
.toast .ic{width:18px;height:18px}
.toast.warn .ic{color:var(--warn)} .toast.danger .ic{color:var(--danger)} .toast.ok .ic{color:var(--ok)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.dlg-wrap{display:none;position:absolute;inset:0;z-index:95;background:var(--scrim);place-items:center;padding:16px}
.dlg-wrap.open{display:grid}
.app[data-size="compact"] .dlg-wrap{place-items:end stretch;padding:0}
.app[data-size="compact"] .dlg{width:100%;max-height:85%;border-radius:20px 20px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.dlg{width:min(460px,100%);max-height:100%;overflow-y:auto;background:var(--bg-2);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:grid;gap:12px}
.dlg h3{margin:0;font-size:17px}
.dlg p{margin:0;color:var(--text-2);font-size:13.5px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.qr-wrap{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.qr{width:148px;height:148px;background:var(--qr-bg);border-radius:12px;padding:8px;image-rendering:pixelated}
.code{font-size:34px;font-weight:600;letter-spacing:.08em}
.url{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--text-2);word-break:break-all;background:var(--bg-inset);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.dev{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
@media (max-width:480px){.qr-wrap{grid-template-columns:1fr;justify-items:center;text-align:center}}
.app.no-anim .dock{transition:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

        const have = bagCount(m.item), need = m.need ?? Math.max(0, m.count - have);
        if (m.state === 'pending' && need === 0) return `<div class="intent done"><h4>${icon('leaf')}${m.item} 채집</h4><p>이미 목표 ${m.count}개 이상 갖고 있습니다 (가방 보유 ${have}개). 채집하지 않았습니다.</p></div>`;
        const body = m.state === 'pending' ? `<p>목표 ${m.count}개 · 가방 보유 ${have}개 → <b>${need}개 더</b> 채집합니다. 정령의 날개 5개를 씁니다.</p><div class="acts"><button type="button" class="btn primary" data-act="intent-go" data-i="${i}" data-needs-conn>채집 시작</button><button type="button" class="btn" data-act="intent-cancel" data-i="${i}">취소</button></div>`
          : m.state === 'running' ? `<p>채집 중… 다른 조작과 긴급 정지는 그대로 쓸 수 있습니다.</p>` : m.state === 'done' ? `<p style="color:var(--ok)">완료 · +${need}개 획득</p>` : m.state === 'stopped' ? `<p style="color:var(--warn)">긴급 정지로 중단했습니다.</p>` : `<p>취소했습니다.</p>`;
        return `<div class="intent ${m.state === 'pending' ? '' : 'done'}"><h4>${icon('leaf')}${m.item} 채집</h4>${body}</div>`;
      }
      if (m.kind === 'collect') {
        return `<div class="intent ${m.state === 'pending' ? '' : 'done'}"><h4>${icon('inbox')}가공물 수거</h4>${m.state === 'pending' ? `<p>수거 가능: ${collectable().map(w => w.n).join(', ') || '없음'}</p><div class="acts"><button type="button" class="btn primary" data-act="intent-collect" data-i="${i}" data-needs-conn>모두 수거</button><button type="button" class="btn" data-act="intent-cancel" data-i="${i}">취소</button></div>` : `<p>${m.state === 'done' ? '수거했습니다.' : '취소했습니다.'}</p>`}</div>`;
      }
    }
    return `<div class="bubble ${m.who} ${m.stream ? 'cursor' : ''}">${m.who === 'ai' ? `<span class="who">${esc(ENGINES.find(x => x.id === (m.eng || S.engine)).nm)}</span>` : ''}${esc(m.text)}</div>`;
  }).join('');
  $('#aiLog').scrollTop = 1e6;
}

/* ───────── 공통 동작 ───────── */
function render() {
  $('#view').innerHTML = (V[S.route] || V.overview)();
  if (S.route === 'inventory') $('#invList').innerHTML = invList();
  if (S.route === 'life') $('#gatherList').innerHTML = gatherList();
  document.querySelectorAll('.rail [data-to], .tabs [data-to]').forEach(b => { if (b.dataset.to === S.route) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
}
function setDock(open, tab) {
  if (tab) S.dockTab = tab;
  S.dockOpen = open;
  app.dataset.dockOpen = open;
  app.dataset.dockTab = S.dockTab;
  document.querySelectorAll('.dock-h [data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.dockTab));
}
function toast(msg, level = 'ok') {
  const el = document.createElement('div');
  el.className = `toast ${level}`;
  el.innerHTML = `${icon(level === 'ok' ? 'check' : level === 'danger' ? 'stop' : 'alert')}<span>${esc(msg)}</span>`;
  $('#toasts').append(el);
  if (level === 'danger' || level === 'warn') $('#alertLive').textContent = msg;
  setTimeout(() => el.remove(), 3200);
  while ($('#toasts').children.length > 3) $('#toasts').firstElementChild.remove();
}
let dlgReturn = null;
function dialog(html) {
  if (!$('#dlgWrap').classList.contains('open')) dlgReturn = document.activeElement;
  $('#dlg').innerHTML = html;
  $('#dlg').querySelector('h3')?.setAttribute('id', 'dlgTitle');
  $('#dlgWrap').classList.add('open');
  $('#dlg').querySelector('button, input, textarea')?.focus();
}
function closeDialog() { $('#dlgWrap').classList.remove('open'); clearInterval(pairTimer); dlgReturn?.focus?.(); dlgReturn = null; }
$('#dlg').addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const f = [...$('#dlg').querySelectorAll('button, input, textarea, select, [tabindex="0"]')];
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});
function go(route) { S.route = route; render(); $('#main').scrollTop = 0; if (app.dataset.dockMode === 'sheet') setDock(false); }
function stop() { toast('행동 정지를 요청했습니다 · stop_action 우선 경로', 'danger'); if (S.gatherJob) { clearTimeout(S.gatherJob); S.gatherJob = null; S.gatherDone?.(false); S.gatherDone = null; toast('진행 중이던 채집을 멈췄습니다', 'warn'); } }
function collectAll() {
  const done = collectable();
  if (!done.length) return toast('아직 완료된 가공물이 없습니다', 'warn');
  D.works = D.works.filter(w => w.s > 0);
  toast(`${done.map(w => w.n).join(', ')} 수거 완료`);
  render();
}
const haveOf = n => bagCount(n) || (D.gather.find(g => g[0] === n) || [])[3] || 0;
function startGather(name, count, done) {
  const need = Math.max(0, count - haveOf(name));
  S.gatherDone = done;
  toast(`${name} 채집을 시작했습니다 · 목표까지 ${need}개`);
  S.gatherJob = setTimeout(() => {
    S.gatherJob = null;
    const it = D.items.find(i => i[0] === 'bag' && i[1] === name);
    if (it) { it[3] += need; it[5] += need; } else D.items.unshift(['bag', name, '재료', need, 0, need]);
    toast(`${name} 채집 완료 · +${need}개`);
    render();
    S.gatherDone?.(true); S.gatherDone = null;
  }, 3000);
}

        <div class="acts"><button type="button" class="btn" data-act="dlg-close">취소</button><button type="button" class="btn primary" data-act="gather-go" data-name="${n}">채집 시작</button></div>`);

      break;

      const inp = $('#chatIn'); inp.value = [...line].slice(0, 42).join(''); inp.dispatchEvent(new Event('input')); inp.focus();

function setEngine(id) {

/* 게임 채팅 입력 */
const chatIn = $('#chatIn');
/* 카운터는 이모지를 붙인 '최종 문장' 길이를 보여준다. 본문 한도 = 50 - 이모지 접미사 길이.
   한글 조합 중에는 자르지 않고 compositionend 때 자른다 (iOS·삼성 키보드 글자 중복 방지). */
function clampChat() {
  const pl = chatPlan(chatIn.value), limit = 50 - (pl ? cp(' ' + pl.emoji) : 2), chars = [...chatIn.value];
  if (chars.length > limit) chatIn.value = chars.slice(0, limit).join('');
}
function updateChatMeta() {
  const pl = chatPlan(chatIn.value), n = pl ? cp(pl.final) : 0;
  $('#chatCnt').textContent = `${n} / 50`;
  $('#chatCnt').classList.toggle('warn', n >= 45);
  $('#chatPv').textContent = pl ? `자동: ${pl.emoji}${pl.beh ? ' ' + pl.beh : ''}` : '';
}
chatIn.addEventListener('input', e => { if (!e.isComposing) clampChat(); updateChatMeta(); });
chatIn.addEventListener('compositionend', () => { clampChat(); updateChatMeta(); });
chatIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendGame(); } });
function sendGame() {
  if (app.dataset.offline === 'true') return;
  const pl = chatPlan(chatIn.value);
  if (!pl) return;
  S.chat.push({ t: nowT(), m: pl.final, beh: pl.beh, ok: 1, src: '직접' });
  chatIn.value = ''; chatIn.dispatchEvent(new Event('input'));
  renderChat();
  toast(`채팅 전송: ${pl.final}`);
}
$('#personaSel').addEventListener('change', e => {

      <label class="search"><input placeholder="이름 (예: 츤데레 메이드)" aria-label="페르소나 이름"></label>
      <label class="search" style="height:auto;padding:8px 12px"><textarea rows="3" style="border:0;outline:0;background:transparent;width:100%;resize:vertical" placeholder="말투 지침 (예: 어미로 '~라구요!', '흥!'을 씀)" aria-label="말투 지침"></textarea></label>
      <div class="acts"><button type="button" class="btn" data-act="dlg-close">취소</button><button type="button" class="btn primary" data-act="dlg-close">저장</button></div>`);

$('#engineMenu').addEventListener('keydown', e => {
  const items = [...$('#engineMenu').querySelectorAll('button')], i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }

/* AI 도우미 */
$('#aiIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('[data-act="send-ai"]').click(); } });
const GATHER_V = ['채집','캐줘','캐라','캐러','모아줘','수집','낚시','낚아'];
const ANSWERS = [
  [['전투력','룬','각인','스펙'], '전투력 88,737 격투가 기준입니다.\n· 무기 각인을 먼저 최대로 올리고, 1티어 룬은 치명 → 공격 순으로 맞추세요.\n· 칭호 효과가 있는 "이거밖에 안 되심?"은 그대로 유지하는 편이 이득입니다.'],
  [['골드','재화','일일','요일'], '골드는 일일 미션 11개 보상과 요일 던전이 가장 안정적입니다.\n· 남은 일일 미션 3개를 먼저 끝내세요.\n· 가공품(질긴 가죽·고급 옷감)은 납품하면 추가 골드를 받습니다.'],
  [['채집','가공','명당','쿨타임'], '가공 시설은 완료 즉시 수거해야 다음 작업이 돕니다. 지금 2건이 완료 상태입니다.\n· 철광석: 던바튼 북쪽 광산\n· 약초: 티르코네일 개울가'],
  [['보스','브레이크','장판','던전'], '브레이크 게이지가 차오를 때 강공격을 모아 두었다가 게이지가 깨지는 순간 몰아넣으세요.\n· 장판은 바깥쪽으로 반 박자 먼저 빠지는 게 안전합니다.'],
  [['진단','캐릭터','스탯'], '현재 진단 결과입니다.\n· 전투력 88,737 (이번 접속 +150)\n· 가방 96.3% — 주의 단계입니다. 다이어트를 권합니다.\n· 일일 미션 8/11, 가공 수거 2건 대기'],
  [['가방','창고','정리','무게'], '가방이 96.3%입니다. 이번 접속에 늘어난 철광석(+34)·양털(+25)을 계정 창고로 옮기면 약 80%대로 내려갑니다.\n가방 화면의 다이어트 필터에서 확인하세요.'],
];
function askAi(q) {
  S.ai.push({ who: 'me', text: q });
  const flat = q.replace(/[\s.,!?~]/g, '');
  if (/^(긴급)?(정지|멈춰|스톱|그만)(해|해줘|해라)?$/.test(flat)) { stop(); S.ai.push({ who: 'ai', text: '행동 정지를 요청했습니다.', eng: S.engine }); return renderAi(); }
  if (/숙제|일일 ?미션/.test(q)) { go('missions'); S.ai.push({ who: 'ai', text: `남은 일일 미션 ${D.daily.rest.length}개: ${D.daily.rest.map(r => r[0]).join(', ')}. 미션 화면을 열었습니다.`, eng: S.engine }); return renderAi(); }
  if (/다이어트|가방 ?정리|무게 ?줄여/.test(q)) { S.invLoc = 'diet'; go('inventory'); S.ai.push({ who: 'ai', text: '가방 다이어트 필터를 켰습니다. 이번 접속에 늘어난 잡템이 위에 보입니다.', eng: S.engine }); return renderAi(); }
  if (/수거|작업대|가공물/.test(q)) { S.ai.push({ who: 'intent', kind: 'collect', state: 'pending' }); return renderAi(); }
  if (GATHER_V.some(v => q.includes(v))) {
    const item = D.gather.map(g => g[0]).sort((a, b) => b.length - a.length).find(n => q.includes(n));
    if (item) { const m = q.match(/(\d+)\s*(개|마리)?/); S.ai.push({ who: 'intent', kind: 'gather', item, count: m ? +m[1] : S.target, state: 'pending' }); return renderAi(); }
  }
  const hit = ANSWERS.find(([ks]) => ks.some(k => q.includes(k)));
  const text = hit ? hit[1] : (S.engine === 'builtin' ? '내장 가이드는 정해진 주제(전투력·골드·채집·던전·진단·가방)만 답합니다. 위 카드에서 골라 보세요.' : '지금 상황에서는 남은 일일 미션 3개를 먼저 끝내고, 가방을 80%대로 정리한 뒤 던전을 도는 순서를 추천합니다.');
  if (S.engine === 'builtin') { S.ai.push({ who: 'ai', text, eng: S.engine }); return renderAi(); }
  const msg = { who: 'ai', text: '', stream: true, eng: S.engine };
  S.ai.push(msg); $('#aiLog').setAttribute('aria-busy', 'true'); renderAi();
  const chars = [...text]; let k = 0;
  const t = setInterval(() => { k += 3; msg.text = chars.slice(0, k).join(''); if (k >= chars.length) { clearInterval(t); msg.stream = false; $('#aiLog').setAttribute('aria-busy', 'false'); } renderAi(); }, 40);
}

/* 페어링 */
function openPair() {
  let left = 300;
  const rows = [['Galaxy Z Fold · Samsung Internet','LAN · 방금'],['iPad · Safari','LAN · 2일 전'],['이 PC · Edge','로컬']];
  dialog(`<h3>폰으로 보기</h3>
    <div class="qr-wrap"><canvas class="qr" id="qr" width="37" height="37" aria-label="페어링 QR (시안용)"></canvas>
      <div style="display:grid;gap:6px"><p>폰 카메라로 QR을 찍으면 바로 연결됩니다. 입력이 필요하면 아래 코드를 쓰세요.</p><div class="code num">482 913</div><div class="faint num" id="pairLeft">5:00 후 만료 · 1회용</div></div></div>
    <div class="url">http://192.168.0.23:17800/pair?code=482913</div>
    <p style="font-size:12.5px">개인 네트워크(집 Wi-Fi)에서만 열립니다. 공용 와이파이에서는 자동으로 닫힙니다.</p>
    <div><b style="font-size:13px">연결된 기기</b>${rows.map(([n, k]) => `<div class="dev"><span>${n}<br><span class="faint" style="font-size:12px">${k}</span></span>${k === '로컬' ? '<span class="pill plain">이 기기</span>' : '<button type="button" class="btn" data-act="dlg-close">연결 해제</button>'}</div>`).join('')}</div>
    <div class="acts"><button type="button" class="btn primary" data-act="dlg-close">닫기</button></div>`);
  drawQr($('#qr'));
  clearInterval(pairTimer);
  pairTimer = setInterval(() => { left--; const el = $('#pairLeft'); if (el) el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} 후 만료 · 1회용`; }, 1000);
}
function drawQr(cv) {
  const x = cv.getContext('2d'), n = 37; let seed = 482913;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const cs = getComputedStyle(app), bg = cs.getPropertyValue('--qr-bg').trim() || 'white', fg = cs.getPropertyValue('--qr-fg').trim() || 'black';
  x.fillStyle = bg; x.fillRect(0, 0, n, n); x.fillStyle = fg;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (rnd() > .52) x.fillRect(i, j, 1, 1);
  const finder = (a, b) => { x.fillStyle = bg; x.fillRect(a - 1, b - 1, 9, 9); x.fillStyle = fg; x.fillRect(a, b, 7, 7); x.fillStyle = bg; x.fillRect(a + 1, b + 1, 5, 5); x.fillStyle = fg; x.fillRect(a + 2, b + 2, 3, 3); };
  finder(1, 1); finder(n - 8, 1); finder(1, n - 8);
}

/* 검색 입력은 목록만 다시 그린다 (포커스 유지) */
app.addEventListener('input', e => {
  if (e.target.id === 'invSearch') { S.invQ = e.target.value; $('#invList').innerHTML = invList(); }
  if (e.target.id === 'gatherSearch') { S.gatherQ = e.target.value; $('#gatherList').innerHTML = gatherList(); }
});

/* 키보드: Esc = 대화상자·시트 닫기 → 그다음 긴급 정지, 1~7 화면 전환 */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === 'Escape') {
    if ($('#dlgWrap').classList.contains('open')) return closeDialog();
    if (!$('#engineMenu').hidden) { $('#engineMenu').hidden = true; $('.engine-btn').setAttribute('aria-expanded', 'false'); return $('.engine-btn').focus(); }
    if (app.dataset.dockMode === 'sheet' && S.dockOpen) return setDock(false);
    if (typing) return document.activeElement.blur();
    if (app.dataset.offline === 'true') return toast('PC와 연결이 끊겨 정지를 보낼 수 없습니다', 'danger');
    return stop();
  }
  if ($('#dlgWrap').classList.contains('open')) return;
  if (!typing && e.key === '/') { e.preventDefault(); setDock(true, 'game'); return setTimeout(() => chatIn.focus(), 50); }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.matches('.card[role="button"]')) { e.preventDefault(); return document.activeElement.click(); }
  if (!typing && /^[1-7]$/.test(e.key)) go(['overview','stats','inventory','currencies','missions','life','nearby'][+e.key - 1]);
});

/* 적응형 자동 갱신 + 가공 카운트다운 */
const markActive = () => { S.active = true; if (S.next > 15) { S.refresh = 15; S.next = 15; } };
app.addEventListener('pointerdown', markActive);
app.addEventListener('keydown', markActive);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S.refresh = 15; S.next = 15; flashRefresh(); } });
function flashRefresh() { const b = $('#refreshInd'); b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 600); }
setInterval(() => {
  if (!document.hidden) {
    S.next--;
    if (S.next <= 0) { S.refresh = S.active ? 15 : Math.min(300, S.refresh + 15); S.active = false; S.next = S.refresh; flashRefresh(); }
    $('#refreshTxt').textContent = `${S.next}초`;
    $('#refreshInd').title = `다음 자동 갱신 ${S.next}초 후 · 현재 주기 ${S.refresh}초 (활동이 없으면 15초씩 늘어납니다, 최대 300초)`;
  }
  let changed = false;
  D.works.forEach(w => { if (w.s > 0) { w.s--; if (w.s === 0) changed = true; } });
  document.querySelectorAll('[data-cd]').forEach(el => { const w = D.works.find(x => x.n === el.dataset.cd); if (w) el.textContent = clock(w.s); });
  if (changed) { toast('가공 완료 · 수거할 수 있습니다'); render(); }
}, 1000);

  triCover: [['Compact · 트라이폴드 접힘','바 형태 폰 화면입니다. 하단 탭과 긴급 정지 버튼(오른쪽 아래)을 씁니다.'],['펼치면','Expanded 배치로 바뀌고, 채팅 시트가 열려 있었다면 옆 패널로 이어집니다.'],['해 볼 것','채팅 탭 → "한마디"를 누르면 대사가 입력창에 채워집니다. 자동으로 보내지 않습니다.']],

let livePostureMQ = null;
function livePosture() {
  try {
    if (matchMedia('(vertical-viewport-segments: 2)').matches) return 'tabletop';
    if (matchMedia('(horizontal-viewport-segments: 2)').matches) return 'book';
  } catch (e) {}
  return 'flat';
}
function segCount() {
  try {
    for (let n = 3; n >= 2; n--) {
      if (matchMedia(`(horizontal-viewport-segments: ${n})`).matches) return `가로 ${n}구역`;
      if (matchMedia(`(vertical-viewport-segments: ${n})`).matches) return `세로 ${n}구역`;
    }
    return matchMedia('(horizontal-viewport-segments: 1)').matches ? '1구역' : '구역 API 미지원';
  } catch (e) { return '구역 API 미지원'; }
}
function applySize() {
  const w = app.clientWidth, h = app.clientHeight;
  if (!w) return;
  if (S.device === 'live') $('#liveInfo').textContent = `${window.innerWidth}×${window.innerHeight} · 배율 ${window.devicePixelRatio} · ${segCount()} · ${matchMedia('(pointer: coarse)').matches ? '터치' : '마우스'}`;
  const dev = DEVICES.find(d => d.id === S.device);
  const posture = dev.posture || (S.device === 'live' ? livePosture() : 'flat');
  const size = w < 600 ? 'compact' : w < 840 ? 'medium' : w < 1200 ? 'expanded' : 'large';
  const short = h < 480, glance = w < 360;
  const mode = posture === 'tabletop' ? 'split' : posture === 'book' ? 'split' : (size === 'expanded' || size === 'large') && !short ? 'side' : 'sheet';
  const prev = { size: app.dataset.size, glance: app.dataset.glance, posture: app.dataset.posture, mode: app.dataset.dockMode };
  if (prev.mode === 'side' && mode === 'sheet' && !chatIn.value && document.activeElement !== chatIn) setDock(false);
  if (prev.mode === 'sheet' && mode === 'side' && !S.dockOpen) setDock(true);
  if (mode === 'split') setDock(true, posture === 'tabletop' ? 'game' : S.dockTab);
  const touch = !!dev.hand || (S.device === 'live' && matchMedia('(pointer: coarse)').matches);
  Object.assign(app.dataset, { size, short, glance, posture, dockMode: mode, touch });
  if (prev.size !== size || prev.glance !== String(glance) || prev.posture !== posture) render();
}
new ResizeObserver(applySize).observe(app);

/* 프레임 배치 */
const stage = $('#stage'), frameBox = $('#frameBox'), device = $('#device'), screen = $('#screen');
function fit() {
  const dev = DEVICES.find(d => d.id === S.device);
  if (!dev.w) return;
  const pad = dev.hand ? 14 : 12, ow = dev.w + pad * 2 + 2, oh = dev.h + pad * 2 + 2;
  const avail = stage.clientWidth, maxH = Math.max(520, window.innerHeight - 170);
  const s = Math.min(1, avail / ow, maxH / oh);
  device.style.transform = `scale(${s})`;
  frameBox.style.width = `${ow * s}px`;
  frameBox.style.height = `${oh * s}px`;
}
function setDevice(id) {
  S.device = id;
  const dev = DEVICES.find(d => d.id === id);
  document.querySelectorAll('#devSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.dev === id));
  if (id === 'live') {
    $('#liveHost').append(app);
    document.body.classList.add('live');
  } else {
    document.body.classList.remove('live');
    screen.style.width = `${dev.w}px`;
    screen.style.height = `${dev.h}px`;
    device.classList.toggle('is-handheld', !!dev.hand);
    screen.querySelectorAll('.crease').forEach(c => c.remove());
    for (let i = 1; i <= (dev.creases || 0); i++) { const c = document.createElement('div'); c.className = 'crease v'; c.style.left = `${i / (dev.creases + 1) * 100}%`; screen.append(c); }
    screen.prepend(app);
    fit();
  }
  $('#notes').innerHTML = NOTES[id].filter(n => n[0]).map(([t, d]) => `<div class="note"><h3>${t}</h3><p>${d}</p></div>`).join('');
  requestAnimationFrame(applySize);
}
$('#devSeg').innerHTML = DEVICES.map(d => `<button type="button" data-dev="${d.id}" aria-pressed="false">${d.nm}<small>${d.sub}</small></button>`).join('');
$('#devSeg').addEventListener('click', e => { const b = e.target.closest('[data-dev]'); if (b) setDevice(b.dataset.dev); });
$('#leaveLive').addEventListener('click', () => setDevice(window.innerWidth < 700 ? 'iphone' : 'pc'));
window.addEventListener('resize', () => { fit(); applySize(); });
try {
  ['(vertical-viewport-segments: 2)', '(horizontal-viewport-segments: 2)'].forEach(q => matchMedia(q).addEventListener?.('change', applySize));
} catch (e) {}

$('#themeSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-theme-set]'); if (!b) return;
  const v = b.dataset.themeSet;
  if (v === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = v;
  document.querySelectorAll('#themeSeg button').forEach(x => x.setAttribute('aria-pressed', x === b));
});
$('#offlineChk').addEventListener('change', e => { app.dataset.offline = e.target.checked; });
$('#dlgWrap').addEventListener('click', e => { if (e.target.id === 'dlgWrap') closeDialog(); });

/* 시작 */
renderChat(); renderPersonas(); renderAi(); render();
setDevice(window.innerWidth < 700 ? 'live' : 'pc');
setTimeout(() => app.classList.remove('no-anim'), 400);
})();
